<head>

<title>Lehrerzeit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column like a Klassenbuch page; tabs at the bottom on phones, on top on wider screens */
:root {
  --bg: #f3f5f2;
  --surface: #ffffff;
  --ink: #1d2a26;
  --muted: #5b6b65;
  --line: #d8dfdb;
  --accent: #1f6b57;      /* Tafelgrün */
  --accent-ink: #ffffff;
  --chalk: #e9b949;       /* Kreidegelb, nur für den laufenden Timer */
  --danger: #b4412f;
  --good: #2f7d4f;
  --c1: #1f6b57; --c2: #2f6fd0; --c3: #d43d3d; --c4: #63b33a; --c5: #f08c00; --c6: #8f1d3f; --c7: #12a4c4; --c8: #e05fa8; --c9: #e2bd00; --c10: #0b2f5c; --c11: #6b7280; --c12: #7b3fe4; --c13: #222222; --c14: #c2c2c2; --c15: #8d5a2b; --c16: #7d8a00; --c17: #00897b; --c18: #ff7a5c; --c19: #b39ddb; --c20: #c8b273;
  --tz1: #3f8f6f; --tz2: #7fb7a3; --tz3: #e2a33a; --tz4: #3b4a7a;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121916; --surface: #1a2420; --ink: #e6ece9; --muted: #9aaba4; --line: #2c3a35;
  --accent: #4fb092; --accent-ink: #0d1613; --chalk: #f0c75e; --danger: #e07a66; --good: #6cc08a;
  --c1: #4fb092; --c2: #5b95f0; --c3: #f06a6a; --c4: #8fd66a; --c5: #ffa733; --c6: #d0607e; --c7: #4fd0e8; --c8: #f08cc4; --c9: #f5d63d; --c10: #c7d7f0; --c11: #9aa3ad; --c12: #a98cf5; --c13: #f2f2f2; --c14: #6f6f6f; --c15: #c9915a; --c16: #c3d14a; --c17: #4db6ac; --c18: #ff9e85; --c19: #cdbdf0; --c20: #ddd09a;
  --tz1: #4fb092; --tz2: #9fd3c0; --tz3: #f0b85a; --tz4: #8f9fd6;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121916; --surface: #1a2420; --ink: #e6ece9; --muted: #9aaba4; --line: #2c3a35;
  --accent: #4fb092; --accent-ink: #0d1613; --chalk: #f0c75e; --danger: #e07a66; --good: #6cc08a;
  --c1: #4fb092; --c2: #5b95f0; --c3: #f06a6a; --c4: #8fd66a; --c5: #ffa733; --c6: #d0607e; --c7: #4fd0e8; --c8: #f08cc4; --c9: #f5d63d; --c10: #c7d7f0; --c11: #9aa3ad; --c12: #a98cf5; --c13: #f2f2f2; --c14: #6f6f6f; --c15: #c9915a; --c16: #c3d14a; --c17: #4db6ac; --c18: #ff9e85; --c19: #cdbdf0; --c20: #ddd09a;
  --tz1: #4fb092; --tz2: #9fd3c0; --tz3: #f0b85a; --tz4: #8f9fd6;
  color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

.app { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 96px; display: flex; flex-direction: column; gap: 20px; }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 4px 12px; flex-wrap: wrap; }
header.top .today { flex-basis: 100%; }
header.top h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; margin: 0; letter-spacing: -0.01em; }
header.top .today { color: var(--muted); font-size: .95rem; }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
nav.tabs button { flex: 1; background: none; border: 0; padding: 12px 4px 14px; font-weight: 600; color: var(--muted); font-size: .95rem; }
nav.tabs button[aria-selected="true"] { color: var(--accent); box-shadow: inset 0 3px 0 var(--accent); }
@media (min-width: 720px) {
  nav.tabs { position: static; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; padding: 0; }
  nav.tabs button[aria-selected="true"] { box-shadow: inset 0 -3px 0 var(--accent); }
  .app { padding-block: 24px 48px; }
}

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
h2 { font-family: var(--font-display); font-weight: 500; font-size: 1.15rem; margin: 0; text-wrap: balance; }
.label { font-size: .78rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }

/* Timer */
.clock { font-family: var(--font-num); font-size: clamp(2.6rem, 12vw, 3.6rem); line-height: 1; letter-spacing: -0.02em; }
.timer.running .clock { color: var(--ink); }
.timer .state { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); flex: none; }
.timer.running .dot { background: var(--chalk); box-shadow: 0 0 0 4px color-mix(in srgb, var(--chalk) 30%, transparent); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--chalk) 10%, transparent); } }
@media (prefers-reduced-motion: reduce) { .timer.running .dot { animation: none; } }

.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.chip { display: flex; align-items: center; gap: 8px; text-align: left; padding: 10px 12px; line-height: 1.2; min-height: 48px; padding-inline: 10px; hyphens: manual; min-width: 0; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-weight: 600; font-size: .95rem; }
/* Handy: Tätigkeiten immer zweispaltig, Start-Knopf bleibt über der Tab-Leiste sichtbar */
/* Ort und Start in einer Leiste */
.startbar { display: flex; gap: 10px; align-items: stretch; }
.startbar .seg { align-self: stretch; flex: none; }
.startbar .seg button { padding: 8px 12px; }
.startbar #startBtn { flex: 1; min-width: 0; }
.longrun { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, var(--surface)); }
.longrun p { margin: 0; }
@media (max-width: 719px) { .startbar { position: sticky; bottom: calc(60px + env(safe-area-inset-bottom, 0px)); z-index: 5; background: var(--surface); padding-block: 8px; margin-block: -8px; } .startbar #startBtn { box-shadow: 0 6px 18px color-mix(in srgb, var(--ink) 22%, transparent); } }
@media (max-width: 480px) { .chips { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; } .chip { min-height: 42px; padding: 7px 9px; font-size: .88rem; gap: 7px; } }
.chip .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; align-self: flex-start; }
.seg button { border: 0; background: var(--bg); padding: 8px 16px; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1 1 140px; }
input[type=text], input[type=date], input[type=time], select { width: 100%; min-width: 0; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); min-height: 44px; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 10px 16px; border-radius: 10px; font-weight: 600; min-height: 44px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.big { font-size: 1.15rem; padding: 16px; width: 100%; font-family: var(--font-display); font-weight: 700; letter-spacing: .01em; }
.btn.stop { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 50%, var(--line)); }
.btn.ghost { background: none; border-color: transparent; color: var(--accent); padding-inline: 8px; }
.hint { color: var(--muted); font-size: .9rem; margin: 0; }

/* Entry list */
.day { display: flex; flex-direction: column; gap: 6px; }
.day-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding-top: 6px; }
.day-head strong { font-family: var(--font-display); font-weight: 500; }
.entry { display: grid; grid-template-columns: 4px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); text-align: left; width: 100%; }
.ttbox { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 4px 0 8px; }
.ownrow { display: flex; align-items: center; gap: 10px; margin: 4px 0; } .ownrow .ownname { flex: 1; } .ownrow .sw { width: 12px; height: 12px; border-radius: 3px; flex: none; }
.news { margin: 6px 0 10px; padding-left: 20px; } .news li { margin: 4px 0; }
.entry .bar { align-self: stretch; border-radius: 2px; }
.entry .main { min-width: 0; display: flex; flex-direction: column; }
.entry .main span:first-child { font-weight: 600; }
.entry .sub { color: var(--muted); font-size: .88rem; overflow-wrap: anywhere; }
.entry .dur { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.entry:hover { border-color: var(--accent); }
.badge { font-size: .72rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line); color: var(--muted); margin-left: 6px; vertical-align: 1px; }

/* Summary */
.periodnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.periodnav .title { text-align: center; flex: 1; }
.periodnav .title strong { font-family: var(--font-display); font-size: 1.15rem; font-weight: 500; display: block; }
.periodnav .title span { color: var(--muted); font-size: .9rem; }
.total { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.total .num { font-size: 2.2rem; }
.split { display: flex; gap: 16px; flex-wrap: wrap; color: var(--muted); font-size: .95rem; }
.split b { color: var(--ink); font-family: var(--font-num); font-weight: 500; }
.bars { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 6px; align-items: end; height: 150px; padding-top: 18px; }
.bars .col { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; height: 100%; min-width: 0; }
.bars .stack { width: 100%; max-width: 42px; display: flex; flex-direction: column-reverse; border-radius: 6px 6px 2px 2px; overflow: hidden; background: color-mix(in srgb, var(--line) 50%, transparent); min-height: 2px; }
.bars .val { font-family: var(--font-num); font-size: .72rem; color: var(--muted); white-space: nowrap; }
.bars .lbl { font-size: .8rem; color: var(--muted); font-weight: 600; }
.bars button.col { background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; border-radius: 8px; }
.bars button.col .lbl { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.bars button.col:active .stack { opacity: .7; }
.tl { display: grid; grid-template-columns: 68px 1fr; margin-top: 4px; }
.tl .zones { position: relative; height: 300px; }
.tl .zones span { position: absolute; right: 8px; transform: translateY(50%); font-size: .78rem; font-weight: 700; color: var(--muted); }
.tl .plot { position: relative; height: 300px; display: grid; grid-template-columns: repeat(7, 1fr); }
.tl .zl { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line); pointer-events: none; }
.tl .day { position: relative; background: none; border: 0; padding: 0; cursor: pointer; }
.tl .core { position: absolute; left: 3px; right: 3px; border-radius: 5px; background: color-mix(in srgb, var(--muted) 24%, transparent); }
.tl .blk { position: absolute; left: 22%; right: 22%; border-radius: 3px; min-height: 2px; }
.tl .days { grid-column: 2; display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; padding-top: 6px; }
.tl .days b { display: block; font-size: .85rem; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.tl .days small { color: var(--muted); font-size: .72rem; }
.tzlegend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .78rem; color: var(--muted); margin-top: 10px; }
.tzlegend i { display: inline-block; width: 18px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; background: color-mix(in srgb, var(--muted) 24%, transparent); }
.catlist { display: flex; flex-direction: column; gap: 8px; }
.catrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; }
.catrow .name { display: flex; align-items: center; gap: 8px; min-width: 0; }
.catrow .track { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--line) 60%, transparent); overflow: hidden; }
.catrow .track i { display: block; height: 100%; border-radius: 3px; }
.weeks { width: 100%; border-collapse: collapse; font-size: .95rem; }
.weeks td, .weeks th { white-space: nowrap; padding: 8px 4px; border-bottom: 1px solid var(--line); text-align: left; }
.weeks td:last-child, .weeks th:last-child { text-align: right; }
.weeks .range { display: block; font-size: .8rem; color: var(--muted); }
.weeks th { font-size: .78rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }

.empty { text-align: center; padding: 28px 12px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.empty p { margin: 0; color: var(--muted); max-width: 36ch; }

/* Dialog */
.overlay { position: fixed; inset: 0; z-index: 20; background: color-mix(in srgb, var(--ink) 45%, transparent); display: flex; align-items: flex-end; justify-content: center; padding: 16px; }
@media (min-width: 560px) { .overlay { align-items: center; } }
.sheet { background: var(--surface); border-radius: var(--radius); width: 100%; max-width: 480px; max-height: 100%; overflow: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
.sheet > * { flex-shrink: 0; }
.sheet .row .field { flex-basis: 120px; }
input[type=date], input[type=time] { -webkit-appearance: none; appearance: none; min-width: 0; max-width: 100%; display: block; text-align: left; }
input::-webkit-date-and-time-value { text-align: left; }
.sheet .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: space-between; }
.sheet .actions div { display: flex; gap: 8px; margin-left: auto; }
.warn { background: color-mix(in srgb, var(--danger) 12%, var(--surface)); color: var(--danger); padding: 10px 12px; border-radius: 10px; font-size: .92rem; margin: 0; }
.headright { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.soll { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.soll > div { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 10px; background: var(--bg); min-width: 0; }
.soll b { font-size: clamp(1.15rem, 5vw, 1.6rem); font-weight: 500; }
.saldo.plus { color: var(--good); }
.saldo.minus { color: var(--danger); }
.offdays { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 14px; }
.offdays .row { gap: 6px; }
.daytoggle { border: 1px solid var(--line); background: var(--bg); color: var(--muted); border-radius: 8px; padding: 6px 10px; font-size: .88rem; font-weight: 600; min-height: 36px; }
.daytoggle[aria-pressed="false"] span { text-decoration: line-through; }
.daytoggle[aria-pressed="true"] { color: var(--ink); border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
.konto { display: flex; flex-direction: column; gap: 6px; }
.track.big { height: 10px; border-radius: 5px; background: color-mix(in srgb, var(--line) 60%, transparent); overflow: hidden; }
.track.big i { display: block; height: 100%; background: var(--accent); border-radius: 5px; }
.weekgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 6px; }
.wk { display: flex; flex-direction: column; align-items: center; gap: 0; padding: 6px 4px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); font-size: .85rem; }
.wk span { color: var(--muted); font-size: .75rem; font-family: var(--font-num); }
.wk[aria-pressed="true"] { background: var(--chalk); border-color: var(--chalk); color: #1d2a26; }
.wk[aria-pressed="true"] span { color: #1d2a26; }
.daytoggle { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.15; }
.daytoggle small { font-size: .7rem; font-weight: 600; text-decoration: none; display: block; color: var(--danger); }
.reasons { display: flex; flex-direction: column; gap: 8px; }
.reasons .chip { width: 100%; }
.syncrow { display: flex; align-items: center; gap: 8px; }
.syncdot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; }
.syncdot.on { background: var(--good); }
.syncdot.err { background: var(--danger); }
.remind { border-color: var(--chalk); background: color-mix(in srgb, var(--chalk) 14%, var(--surface)); }
.remind p { margin: 0; }
.toast.act { display: flex; align-items: center; white-space: nowrap; }
.toast button { margin-left: 14px; background: none; border: 0; color: inherit; font: inherit; text-decoration: underline; text-underline-offset: 3px; padding: 6px 2px; cursor: pointer; }
.toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; z-index: 30; font-weight: 600; max-width: calc(100% - 32px); }
</style>

<div class="app" lang="de">
  <header class="top">
    <h1>Lehrerzeit</h1>
    <button class="btn ghost" id="openSettings">Einstellungen</button>
    <span class="today" id="todayLabel"></span>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-erfassen" aria-selected="true" data-view="erfassen">Erfassen</button>
    <button role="tab" id="tab-eintraege" aria-selected="false" data-view="eintraege">Einträge</button>
    <button role="tab" id="tab-auswertung" aria-selected="false" data-view="auswertung">Auswertung</button>
  </nav>

  <main id="view"></main>
</div>
<div id="modalRoot" lang="de"></div>

<script>
(() => {
  const BASE_CATS = [
    { id: 'unterricht', name: 'Unterricht', color: 'var(--c1)' },
    { id: 'vorbereitung', name: 'Vor-/Nach\u00ADbereitung', color: 'var(--c2)' },
    { id: 'lernzeit', name: 'Lernzeit', color: 'var(--c7)' },
    { id: 'korrektur', name: 'Korrekturen', color: 'var(--c3)' },
    { id: 'administration', name: 'Administra\u00ADtion', color: 'var(--c11)' },
    { id: 'klasse', name: 'Klassen\u00ADorganisation', color: 'var(--c15)' },
    { id: 'leitung', name: 'Leitungs\u00ADtätigkeit', color: 'var(--c12)' },
    { id: 'eltern', name: 'Schüler-/Eltern\u00ADgespräch', color: 'var(--c5)' },
    { id: 'austausch', name: 'Kollegialer Austausch', color: 'var(--c8)' },
    { id: 'konferenz', name: 'Konferenzen', color: 'var(--c4)' },
    { id: 'fortbildung', name: 'Fortbil\u00ADdungen', color: 'var(--c9)' },
    { id: 'schulentwicklung', name: 'Schul\u00ADentwicklung', color: 'var(--c10)' },
    { id: 'fahrt', name: 'Klassen\u00ADfahrt', color: 'var(--c6)' },
    { id: 'veranstaltung', name: 'Klassen-/Schul\u00ADveranstaltung', color: 'var(--c16)' },
    { id: 'praktikum', name: 'Praktikums\u00ADbesuch', color: 'var(--c13)' },
    { id: 'sonstiges', name: 'Sonstiges (s. Notiz)', color: 'var(--c14)' },
  ];
  const PLACES = { schule: 'Schule', zuhause: 'Zuhause' };

    const rl = document.getElementById('remLater'); if (rl) rl.onclick = () => { state.backupSnooze = Date.now() + DAY; save(); render(); };
    const rf = document.getElementById('restFile'); if (rf) rf.onchange = readBackupInput;
    const no = document.getElementById('newsOk'); if (no) no.onclick = () => { state.seenV = APP_V; save(); render(); };
    const rn = document.getElementById('restNo'); if (rn) rn.onclick = () => { state.restoreDismissed = true; save(); render(); };
    bindEntries();
  }

  function entryHTML(e) {
    const c = catById(e.cat);
    return `<button class="entry" data-entry="${e.id}"><span class="bar" style="background:${c.color}"></span>
      <span class="main"><span>${c.name}<span class="badge">${PLACES[e.place]}</span></span>
      <span class="sub">${fmtTime(e.start)}–${fmtTime(e.end)}${e.note ? ' · ' + esc(e.note) : ''}</span></span>
      <span class="dur">${fmtDur(e.end - e.start)}</span></button>`;
  }
  function bindEntries() {
    $view.querySelectorAll('[data-entry]').forEach(b => b.onclick = () => openEditor(state.entries.find(e => e.id === b.dataset.entry)));
  }

  function renderEintraege() {
    const sorted = state.entries.slice().sort((a, b) => b.start - a.start);
    if (!sorted.length) { $view.innerHTML = emptyHTML() + devicesPanelHTML(); bindEmpty(); bindDevicesPanel(); return; }
    const groups = new Map();
    for (const e of sorted) { const k = startOfDay(e.start); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(e); }
    let html = `<div class="row" style="justify-content:space-between"><h2>Alle Einträge</h2><button class="btn" id="addBtn">Zeit nachtragen</button></div>`;
    for (const [k, list] of groups) {
      const tot = list.reduce((s, e) => s + e.end - e.start, 0);
      html += `<section class="day"><div class="day-head"><strong>${fmtDay(k)}</strong><span class="num">${fmtDur(tot)} h</span></div>${list.map(entryHTML).join('')}</section>`;
    }
    html += devicesPanelHTML();
    html += `<button class="btn ghost" id="wipeBtn" style="align-self:center">Alle Daten löschen</button>`;
    $view.innerHTML = html;
    bindDevicesPanel();
    document.getElementById('addBtn').onclick = () => openEditor(null);
    document.getElementById('wipeBtn').onclick = openWipe;
    bindEntries();
  }

  function emptyHTML() {
    return `<section class="panel empty"><h2>Noch keine Zeiten erfasst</h2>
      <p>Starte den Timer unter „Erfassen“ oder trage eine Zeit nach. Zum Ausprobieren kannst du eine Beispielwoche laden und später wieder löschen.</p>
      <div class="row" style="justify-content:center"><button class="btn primary" id="goErfassen">Zeit erfassen</button><button class="btn" id="demoBtn">Beispielwoche laden</button></div></section>`;
  }
  function bindEmpty() {
    document.getElementById('goErfassen').onclick = () => setView('erfassen');
    document.getElementById('demoBtn').onclick = loadDemo;
  }

  function catListHTML(byCat, total) {
    const max = Math.max(1, ...Object.values(byCat));
    return `<div class="catlist">${CATS.filter(c => byCat[c.id]).sort((a, b) => byCat[b.id] - byCat[a.id]).map(c => `
      <div class="catrow"><span class="name"><span class="sw" style="width:10px;height:10px;border-radius:3px;background:${c.color}"></span>${c.name}</span>
      <span class="num">${fmtDur(byCat[c.id])} h <span class="hint">${Math.round(byCat[c.id] / total * 100)} %</span></span>
      <span class="track"><i style="width:${byCat[c.id] / max * 100}%;background:${c.color}"></i></span></div>`).join('')}</div>`;
  }
  // Tagesverlauf: eine Säule je Tag, unten Vormittag, oben Nacht
  function timelineHTML(from) {
    const pos = h => (h - 6) / 24 * 100;
    const days = [];
    for (let i = 0; i < 7; i++) {
      const d = addDays(from, i), H = 3600000;
      // je Tagesabschnitt von der unteren Linie aus stapeln (zeitliche Reihenfolge); frühe Arbeit vor 6 Uhr zählt zur Nacht
      const zoneOf = h => h < 6 || h >= 22 ? 3 : h < 12 ? 0 : h < 17 ? 1 : 2;
      const fill = [0, 0, 0, 0], blocks = [];
      const cuts = [0, 6, 12, 17, 22, 30];
      for (const e of allEntries().filter(x => x.start >= d && x.start < addDays(d, 1)).sort((x, y) => x.start - y.start)) {
        const a = (e.start - d) / H, b = Math.min((e.end - d) / H, 30), c = catById(e.cat).color;
        for (let k = 0; k < cuts.length - 1; k++) {
          const pa = Math.max(a, cuts[k]), pb = Math.min(b, cuts[k + 1]); if (pb <= pa) continue;
          const z = zoneOf(pa), base = TZ[z].a, len = Math.min(pb - pa, TZ[z].b - TZ[z].a - fill[z]);
          if (len > 0) blocks.push(`<i class="blk" style="bottom:${pos(base + fill[z])}%;height:${len / 24 * 100}%;background:${c}"></i>`);
          fill[z] += Math.max(0, len);
        }
      }
      const core = TZ.map((z, k) => {
        const len = coreFor(d).reduce((sum, [ca, cb]) => sum + Math.max(0, Math.min(cb / 60, z.b) - Math.max(ca / 60, z.a)), 0);
        return len ? `<i class="core" style="bottom:${pos(z.a)}%;height:${len / 24 * 100}%"></i>` : '';
      }).join('');
      days.push(`<button class="day" data-day="${d}" aria-label="${fmtDay(d)}: Einträge ansehen">${core}${blocks.join('')}</button>`);
    }
    return `<div class="tl">
      <div class="zones">${TZ.map(z => `<span style="bottom:${(pos(z.a) + pos(z.b)) / 2}%">${z.name}</span>`).join('')}</div>
      <div class="plot">${[6, 12, 17, 22, 30].map(h => `<i class="zl" style="bottom:${pos(h)}%"></i>`).join('')}${days.join('')}</div>
      <div class="days">${[0, 1, 2, 3, 4, 5, 6].map(i => { const d = addDays(from, i); return `<span><b>${WD[new Date(d).getDay()]}</b><small>${fmtShort(d).slice(0, 3)}</small></span>`; }).join('')}</div>
    </div>`;
  }
  function tzHTML(from, to) {
    const t = tzSum(from, to); if (!t.total) return '';
    const max = Math.max(...Object.values(t.by), 1);
    const hasCore = !!state.coreHours;
    return `<section class="panel"><h2>Nach Tageszeit</h2>
      <div class="bars" style="--n:4">${TZ.map((z, i) => `<div class="col"><span class="val">${fmtDur(t.by[z.id])}</span>
        <div class="stack" style="height:${t.by[z.id] / max * 100}%"><i style="display:block;height:100%;background:var(--tz${i + 1})"></i></div>
        <span class="lbl">${z.name}</span><span class="val">${Math.round(t.by[z.id] / t.total * 100)} %</span></div>`).join('')}</div>
      ${hasCore ? `<div class="soll" style="grid-template-columns:1fr 1fr;margin-top:12px"><div><span class="label">In Kernarbeitszeit</span><b class="num">${fmtDur(t.core)}</b></div><div><span class="label">Außerhalb</span><b class="num">${fmtDur(t.total - t.core)}</b></div></div>` : `<p class="hint" style="margin-top:10px">Trag unter Einstellungen deine Kernarbeitszeit ein, dann siehst du hier, wie viel du außerhalb davon arbeitest.</p>`}
    </section>`;
  }
  function barsHTML(cols) {
    const max = Math.max(3600000, ...cols.map(c => c.total));
    return `<div class="bars" style="--n:${cols.length}">${cols.map(col => `
      <${col.day != null ? `button class="col" data-day="${col.day}" aria-label="${col.label}: Einträge ansehen oder nachtragen"` : 'div class="col"'}><span class="val">${col.total ? fmtDur(col.total) : ''}</span>
      <div class="stack" style="height:${col.total / max * 100}%">${CATS.filter(c => col.byCat[c.id]).map(c => `<i style="display:block;background:${c.color};height:${col.byCat[c.id] / col.total * 100}%"></i>`).join('')}</div>
      <span class="lbl">${col.label}</span></${col.day != null ? 'button' : 'div'}>`).join('')}</div>`;
  }

  // ---------- Soll (Jahresarbeitszeit, verteilt auf Unterrichtswochen) ----------
  const SETTINGS_DEFAULT = { yearly: 1805, weeks: 40, pct: 100, since: null, yearStart: '08-01' };
  const settings = () => { const s = Object.assign({}, SETTINGS_DEFAULT, state.settings || {}); delete s.weekly; return s; };
  const keyOf = t => fmtDateInput(t);
  const sinceTs = () => {
    const st = settings();
    if (st.since) { const [y, m, d] = st.since.split('-').map(Number); return new Date(y, m - 1, d).getTime(); }
    const first = state.entries.reduce((a, e) => Math.min(a, e.start), Infinity);
    return startOfDay(isFinite(first) ? first : Date.now());
  };
  const weeklySoll = () => { const st = settings(); return st.yearly * st.pct / 100 / st.weeks * 3600000; };
  const dailySoll = () => weeklySoll() / 5;
  const OFF_REASONS = { bft: 'Beweglicher Ferientag', feiertag: 'Feiertag', krank: 'Krank', urlaub: 'Sonderurlaub', frei: 'Frei' };
  const offReason = t => { const v = state.offDays && state.offDays[keyOf(t)]; return v ? (OFF_REASONS[v] ? v : 'frei') : null; };
  const isOff = t => !!offReason(t);
  const isHoliday = t => !!(state.holidayWeeks && state.holidayWeeks[keyOf(startOfWeek(t))]);
  function schoolYearStart(t) {
    const [m, d] = settings().yearStart.split('-').map(Number);
    const y = new Date(t).getFullYear();
    const s = new Date(y, m - 1, d).getTime();
    return s > t ? new Date(y - 1, m - 1, d).getTime() : s;
  }
  const schoolYearEnd = s => { const d = new Date(s); return new Date(d.getFullYear() + 1, d.getMonth(), d.getDate()).getTime(); };
  const schoolYearLabel = s => { const y = new Date(s).getFullYear(); return `${y}/${String(y + 1).slice(2)}`; };
  // Soll für [from, to): Mo–Fr in Unterrichtswochen, ab Erfassungsbeginn, bis einschließlich heute, ohne freie Tage
  function sollRange(from, to) {
    const today = startOfDay(Date.now()), since = sinceTs();
    let n = 0;
    for (let d = startOfDay(from); d < to; d = addDays(d, 1)) {
      const wd = new Date(d).getDay();
      if (wd === 0 || wd === 6 || d < since || d > today || isOff(d) || isHoliday(d)) continue;
      n++;
    }
    return n * dailySoll();
  }
  const fmtSigned = ms => (ms >= 0 ? '+' : '−') + fmtDur(Math.abs(ms));
  const fmtNum = (n, dig = 2) => n.toLocaleString('de-DE', { minimumFractionDigits: 0, maximumFractionDigits: dig });
  function sollHTML(ist, from, to) {
    const soll = sollRange(from, to), diff = ist - soll;
    const future = addDays(startOfDay(Date.now()), 1) < to;
    return `<div class="soll">
      <div><span class="label">Ist</span><b class="num">${fmtDur(ist)}</b></div>
      <div><span class="label">${future ? 'Soll bis heute' : 'Soll'}</span><b class="num">${fmtDur(soll)}</b></div>
      <div><span class="label">Saldo</span><b class="num saldo ${diff >= 0 ? 'plus' : 'minus'}">${fmtSigned(diff)}</b></div>
    </div>`;
  }
  function toggleHoliday(mondayKey) {
    state.holidayWeeks = state.holidayWeeks || {};
    state.holidayWeeks[mondayKey] = !state.holidayWeeks[mondayKey];
    save(); render();
  }

  function renderAuswertung() {
    if (!state.entries.length && !state.running) { $view.innerHTML = emptyHTML(); bindEmpty(); return; }
    let html = `<div class="seg" role="group" aria-label="Zeitraum" style="align-self:center">
      <button data-period="woche" aria-pressed="${period === 'woche'}">Woche</button><button data-period="monat" aria-pressed="${period === 'monat'}">Monat</button><button data-period="jahr" aria-pressed="${period === 'jahr'}">Schuljahr</button></div>`;
    let from, to, label, yearWeeks = [];
    if (period === 'woche') {
      from = weekAnchor; to = addDays(from, 7);
      const { week, year } = isoWeek(from);
      label = `KW${pad(week)}-${year}`;
      const s = sumRange(from, to);
      const hol = isHoliday(from);
      const cols = [];
      for (let i = 0; i < 7; i++) { const d = addDays(from, i); const x = sumRange(d, addDays(d, 1)); cols.push({ label: WD[new Date(d).getDay()], day: d, ...x }); }
      const days = [0, 1, 2, 3, 4].map(i => addDays(from, i));
      html += `<section class="panel">
        <div class="periodnav"><button class="btn" data-nav="-1" aria-label="Vorige Woche">‹</button>
          <div class="title"><strong>KW ${week} · ${year}</strong><span>${fmtShort(from)} – ${fmtShort(addDays(to, -1))}${hol ? ' · Ferienwoche' : ''}</span></div>
          <button class="btn" data-nav="1" aria-label="Nächste Woche">›</button></div>
        ${sollHTML(s.total, from, to)}
        <div class="split"><span>Schule <b>${fmtDur(s.byPlace.schule)} h</b></span><span>Zuhause <b>${fmtDur(s.byPlace.zuhause)} h</b></span></div>
        ${barsHTML(cols)}
        <p class="hint" style="text-align:center;margin-top:4px">Wochentag antippen, um Zeiten nachzutragen oder zu korrigieren.</p>
        <div class="offdays">
          <div class="seg" role="group" aria-label="Art der Woche"><button data-hw="0" aria-pressed="${!hol}">Unterrichtswoche</button><button data-hw="1" aria-pressed="${hol}">Ferienwoche</button></div>
          ${hol ? `<p class="hint">Ferienwochen haben kein Soll. Was du hier arbeitest, zählt trotzdem für dein Jahreskonto.</p>` : `
          <span class="label">Arbeitstage mit Soll</span>
          <div class="row">${days.map(d => `<button class="daytoggle" data-off="${keyOf(d)}" aria-pressed="${!isOff(d)}"><span>${WD[new Date(d).getDay()]} ${fmtShort(d)}</span>${isOff(d) ? `<small>${OFF_REASONS[offReason(d)]}</small>` : ''}</button>`).join('')}</div>
          <p class="hint">Tag antippen, um ihn als frei zu kennzeichnen (z. B. beweglicher Ferientag, Feiertag, krank). Freie Tage zählen nicht zum Soll.</p>`}
        </div>
      </section>`;
      if (s.total) html += `<section class="panel"><h2>Tagesverlauf</h2><p class="hint">Wann du gearbeitet hast${state.coreHours ? '. Grau hinterlegt: deine Kernarbeitszeit' : ''}. Tag antippen für Details.</p>${timelineHTML(from)}
        <div class="tzlegend">${state.coreHours ? '<span><i></i>Kernarbeitszeit</span>' : ''}${CATS.filter(c => s.byCat[c.id]).map(c => `<span><i style="background:${c.color};width:10px"></i>${c.name}</span>`).join('')}</div></section>`;
      html += tzHTML(from, to);
      if (s.total) html += `<section class="panel"><h2>Nach Tätigkeit</h2>${catListHTML(s.byCat, s.total)}</section>`;
    } else if (period === 'monat') {
      const m = new Date(monthAnchor); from = monthAnchor; to = new Date(m.getFullYear(), m.getMonth() + 1, 1).getTime();
      label = `${m.getFullYear()}-${pad(m.getMonth() + 1)}`;
      const s = sumRange(from, to);
      const rows = [];
      for (let w = startOfWeek(from); w < to; w = addDays(w, 7)) {
        const a = Math.max(w, from), b = Math.min(addDays(w, 7), to);
        rows.push({ kw: isoWeek(w).week, a, b, hol: isHoliday(w), ...sumRange(a, b), soll: sollRange(a, b) });
      }
      html += `<section class="panel">
        <div class="periodnav"><button class="btn" data-nav="-1" aria-label="Voriger Monat">‹</button>
          <div class="title"><strong>${MONTHS[m.getMonth()]} ${m.getFullYear()}</strong><span>${rows.length} Kalenderwochen</span></div>
          <button class="btn" data-nav="1" aria-label="Nächster Monat">›</button></div>
        ${sollHTML(s.total, from, to)}
        <div class="split"><span>Schule <b>${fmtDur(s.byPlace.schule)} h</b></span><span>Zuhause <b>${fmtDur(s.byPlace.zuhause)} h</b></span></div>
        <div style="overflow-x:auto"><table class="weeks"><thead><tr><th>Woche</th><th>Ist</th><th>Soll</th><th>Saldo</th></tr></thead><tbody>
        ${rows.map(r => `<tr><td>KW ${r.kw}<span class="range">${fmtShort(r.a)}–${fmtShort(addDays(r.b, -1))}${r.hol ? ' · Ferien' : ''}</span></td><td class="num">${fmtDur(r.total)}</td><td class="num">${fmtDur(r.soll)}</td><td class="num saldo ${r.total - r.soll >= 0 ? 'plus' : 'minus'}">${r.soll || r.total ? fmtSigned(r.total - r.soll) : ''}</td></tr>`).join('')}
        </tbody></table></div>
      </section>`;
      html += tzHTML(from, to);
      if (s.total) html += `<section class="panel"><h2>Nach Tätigkeit</h2>${catListHTML(s.byCat, s.total)}</section>`;
    } else {
      const st = settings();
      from = schoolYearStart(yearAnchor); to = schoolYearEnd(from);
      label = `Schuljahr-${schoolYearLabel(from).replace('/', '-')}`;
      const s = sumRange(from, to);
      const yearSoll = st.yearly * st.pct / 100 * 3600000;
      const today = startOfDay(Date.now());
      // Wochen des Schuljahres (nach Montag)
      const weeks = [];
      for (let w = startOfWeek(from) < from ? addDays(startOfWeek(from), 7) : from; w < to; w = addDays(w, 7)) weeks.push(w);
      yearWeeks = weeks;
      const holCount = weeks.filter(isHoliday).length;
      const teachCount = weeks.length - holCount;
      const teachSoFar = weeks.filter(w => !isHoliday(w) && w <= today && addDays(w, 7) > sinceTs()).length;
      let holWork = 0;
      for (const w of weeks) if (isHoliday(w)) holWork += sumRange(Math.max(w, from), Math.min(addDays(w, 7), to)).total;
      const pctDone = Math.min(100, s.total / yearSoll * 100);
      const months = [];
      for (let mm = new Date(from); mm.getTime() < to; mm = new Date(mm.getFullYear(), mm.getMonth() + 1, 1)) {
        const a = mm.getTime(), b = new Date(mm.getFullYear(), mm.getMonth() + 1, 1).getTime();
        months.push({ name: MONTHS[mm.getMonth()], a, ...sumRange(a, b), soll: sollRange(a, b) });
      }
      html += `<section class="panel">
        <div class="periodnav"><button class="btn" data-nav="-1" aria-label="Voriges Schuljahr">‹</button>
          <div class="title"><strong>Schuljahr ${schoolYearLabel(from)}</strong><span>${fmtShort(from)}${new Date(from).getFullYear()} – ${fmtShort(addDays(to, -1))}${new Date(addDays(to, -1)).getFullYear()}</span></div>
          <button class="btn" data-nav="1" aria-label="Nächstes Schuljahr">›</button></div>
        <div class="konto">
          <div class="total"><span class="num">${fmtDur(s.total)}</span><span class="hint">von ${fmtNum(yearSoll / 3600000)} h Jahressoll</span></div>
          <div class="track big"><i style="width:${pctDone}%"></i></div>
          <span class="hint">${fmtNum(pctDone, 1)} % erreicht · noch ${fmtDur(Math.max(0, yearSoll - s.total))} h offen</span>
        </div>
        ${sollHTML(s.total, from, to)}
        <div class="split"><span>Unterrichtswochen bisher <b>${teachSoFar} von ${fmtNum(st.weeks)}</b></span><span>Arbeit in Ferienwochen <b>${fmtDur(holWork)} h</b></span></div>
        <div style="overflow-x:auto"><table class="weeks"><thead><tr><th>Monat</th><th>Ist</th><th>Soll</th><th>Saldo</th></tr></thead><tbody>
        ${months.map(r => `<tr><td>${r.name}</td><td class="num">${fmtDur(r.total)}</td><td class="num">${fmtDur(r.soll)}</td><td class="num saldo ${r.total - r.soll >= 0 ? 'plus' : 'minus'}">${r.soll || r.total ? fmtSigned(r.total - r.soll) : ''}</td></tr>`).join('')}
        </tbody></table></div>
      </section>
      <section class="panel">
        <h2>Ferienwochen festlegen</h2>
        <p class="hint">Tippe die Wochen an, in denen Ferien sind. Sie haben kein Soll. Markiert: ${holCount} Ferienwochen, bleiben ${teachCount} Unterrichtswochen.${teachCount !== st.weeks ? ` Für ${fmtNum(st.weeks)} Unterrichtswochen sollten ${weeks.length - st.weeks} Wochen markiert sein.` : ''}</p>
        <div class="row">${HOLIDAY_PRESETS['nrw-' + schoolYearLabel(from).replace('/', '-')] ? `<button class="btn" id="presetNRW">NRW-Ferien ${schoolYearLabel(from)} eintragen</button>` : ''}<button class="btn ghost" id="clearHol">Alle Markierungen entfernen</button></div>
        <div class="weekgrid">${weeks.map(w => `<button class="wk" data-hwk="${keyOf(w)}" aria-pressed="${isHoliday(w)}"><b>KW ${isoWeek(w).week}</b><span>${fmtShort(w)}</span></button>`).join('')}</div>
      </section>`;
      html += tzHTML(from, to);
      if (s.total) html += `<section class="panel"><h2>Nach Tätigkeit</h2>${catListHTML(s.byCat, s.total)}</section>`;
    }
    const st = settings();
    html += `<section class="panel">
      <h2>Excel-Export</h2>
      <p class="hint">Enthält alle Einträge, Wochensummen mit Soll und Saldo sowie die Summen nach Tätigkeit.</p>
      <div class="row"><button class="btn primary" id="xlsPeriod">${period === 'woche' ? 'Diese Woche' : period === 'monat' ? 'Diesen Monat' : 'Dieses Schuljahr'} exportieren</button><button class="btn" id="xlsAll">Alles exportieren</button></div>
      <div class="row" style="justify-content:space-between"><p class="hint" style="flex:1 1 200px">Soll: ${fmtNum(st.yearly)} h im Jahr${st.pct !== 100 ? ` bei ${fmtNum(st.pct)} %` : ''} auf ${fmtNum(st.weeks)} Unterrichtswochen, also ${fmtNum(weeklySoll() / 3600000)} h pro Unterrichtswoche (${fmtDur(dailySoll())} h pro Tag).</p><button class="btn ghost" id="openSettings2">Soll ändern</button></div>
    </section>`;
    $view.innerHTML = html;
    $view.querySelectorAll('[data-period]').forEach(b => b.onclick = () => { period = b.dataset.period; render(); });
    $view.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => {
      const n = +b.dataset.nav;
      if (period === 'woche') weekAnchor = addDays(weekAnchor, 7 * n);
      else if (period === 'monat') { const d = new Date(monthAnchor); monthAnchor = new Date(d.getFullYear(), d.getMonth() + n, 1).getTime(); }
      else { const d = new Date(schoolYearStart(yearAnchor)); yearAnchor = new Date(d.getFullYear() + n, d.getMonth(), d.getDate()).getTime(); }
      render();
    });
    $view.querySelectorAll('[data-off]').forEach(b => b.onclick = () => openOffDay(b.dataset.off));
    $view.querySelectorAll('[data-day]').forEach(b => b.onclick = () => openDay(+b.dataset.day));
    $view.querySelectorAll('[data-hw]').forEach(b => b.onclick = () => { if ((b.dataset.hw === '1') !== isHoliday(from)) toggleHoliday(keyOf(from)); });
    $view.querySelectorAll('[data-hwk]').forEach(b => b.onclick = () => toggleHoliday(b.dataset.hwk));
    const pn = document.getElementById('presetNRW'); if (pn) pn.onclick = () => { applyPreset('nrw-' + schoolYearLabel(from).replace('/', '-')); render(); toast('NRW-Ferien eingetragen'); };
    const ch = document.getElementById('clearHol'); if (ch) ch.onclick = () => { state.holidayWeeks = state.holidayWeeks || {}; for (const w of yearWeeks) if (state.holidayWeeks[keyOf(w)]) state.holidayWeeks[keyOf(w)] = false; save(); render(); toast('Markierungen in diesem Schuljahr entfernt'); };
    document.getElementById('xlsPeriod').onclick = () => exportExcel(from, to, label);
    document.getElementById('xlsAll').onclick = () => {
      const first = state.entries.reduce((a, e) => Math.min(a, e.start), Infinity);
      const last = state.entries.reduce((a, e) => Math.max(a, e.end), Date.now());
      exportExcel(startOfWeek(isFinite(first) ? first : Date.now()), addDays(startOfWeek(last), 7), 'gesamt');

    const preview = () => {

    const cats = new Set(activeCats().map(c => c.id));

    const used = id => state.entries.some(e => e.cat === id) || (state.running && state.running.cat === id);
    const listCats = () => [...BASE_CATS.slice(0, -1), ...own.filter(c => !c.deleted).map(c => ({ id: c.id, name: esc(c.name), color: OWN_COLORS[c.color % OWN_COLORS.length] })), BASE_CATS[BASE_CATS.length - 1]];
    const drawOwn = (msg) => {

      box.innerHTML = `${live.map(c => `<div class="ownrow"><span class="sw" style="background:${OWN_COLORS[c.color % OWN_COLORS.length]}"></span><span class="ownname">${esc(c.name)}</span><button class="btn ghost" data-owndel="${c.id}">Entfernen</button></div>`).join('')}
        ${live.length < MAX_OWN ? `<div class="row"><input type="text" id="stOwnName" maxlength="30" placeholder="z. B. Bibliothek, Ganztag, Sport-AG"><button class="btn" id="stOwnAdd">Hinzufügen</button></div>` : ''}

      box.querySelectorAll('[data-owndel]').forEach(b => b.onclick = () => {
        const id = b.dataset.owndel;

        cats.delete(id);
        own = used(id) ? own.map(c => c.id === id ? { ...c, deleted: true } : c) : own.filter(c => c.id !== id);
        drawCats(); drawOwn();
      });
      const add = document.getElementById('stOwnAdd'); if (add) add.onclick = () => {

        if (!name) return drawOwn('Bitte einen Namen eingeben.');
        if (listCats().some(c => plain(c.raw || c.name).toLowerCase() === name.toLowerCase())) return drawOwn('Diese Tätigkeit gibt es schon.');
        const taken = new Set(own.filter(c => !c.deleted).map(c => c.color));
        const color = [0, 1, 2, 3].find(i => !taken.has(i));
        const c = { id: 'own-' + uid(), name, color };
        own.push(c); cats.add(c.id); drawCats(); drawOwn();

      if (!(y > 0 && y <= 3000)) return fail('Bitte ein Jahressoll zwischen 1 und 3000 Stunden eingeben.');
      if (!(w >= 1 && w <= 52)) return fail('Bitte zwischen 1 und 52 Unterrichtswochen eingeben.');
      if (!(p > 0 && p <= 100)) return fail('Bitte einen Umfang zwischen 1 und 100 % eingeben.');
      if (!ys || +ys[1] < 1 || +ys[1] > 31 || +ys[2] < 1 || +ys[2] > 12) return fail('Bitte den Schuljahresbeginn als Tag.Monat eingeben, z. B. 01.08.');
      const tt = {};
      for (const [d, n] of TT_DAYS) {
        const b = parseBlocks(document.getElementById('stTT' + d).value);
        if (!b) return fail(`Stundenplan ${n}: bitte Zeiten wie „7:45–13:05“ eingeben, mehrere mit Komma getrennt.`);
        if (b.length) tt[d] = b;
      }
      const ch = {};
      for (const [d, n] of TT_DAYS) {
        const b = parseBlocks(document.getElementById('stCore' + d).value);
        if (!b) return fail(`Kernarbeitszeit ${n}: bitte Zeiten wie „7:30–16:00“ eingeben.`);
        if (b.length) ch[d] = b;
      }
      state.timetable = Object.keys(tt).length ? tt : null;
      state.coreHours = Object.keys(ch).length ? ch : null;
      state.settings = { yearly: y, weeks: w, pct: p, since: since || null, yearStart: `${pad(+ys[2])}-${pad(+ys[1])}` };
      state.customCats = own.length ? own : null; refreshCats();
      if (cats.size < selectable().length) state.settings.cats = selectable().filter(c => cats.has(c.id)).map(c => c.id);
      sel.cat = firstActive(sel.cat);
      save(); close(); render(); toast('Einstellungen gespeichert');
    };
  }

  // ---------- Excel ----------
  const downloadsP = (window.claude && typeof window.claude.use === 'function') ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
  function loadXLSX() {
    if (window.XLSX) return Promise.resolve(window.XLSX);
    return new Promise((res, rej) => {
      const sc = document.createElement('script');
      sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      sc.onload = () => res(window.XLSX); sc.onerror = () => rej(new Error('load'));
      document.head.appendChild(sc);
    });
  }
  const plain = s => s.replace(/­/g, '');
  const xlDate = t => { const d = new Date(t); return (Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(1899, 11, 30)) / DAY; };
  const xlTime = t => { const d = new Date(t); return (d.getHours() * 60 + d.getMinutes()) / 1440; };
  const hrs = ms => Math.round(ms / 36000) / 100;

  async function exportExcel(from, to, label) {
    let X;
    try { X = await loadXLSX(); } catch (e) { toast('Excel-Modul nicht geladen. Bitte Internetverbindung prüfen.'); return; }
    const st = settings();
    const entries = state.entries.filter(e => e.end > from && e.start < to).sort((a, b) => a.start - b.start);
    function sheet(aoa, formats, widths) {
      const ws = X.utils.aoa_to_sheet(aoa);
      for (let r = 1; r < aoa.length; r++) for (const [c, z] of Object.entries(formats)) {
        const ref = X.utils.encode_cell({ r, c: +c }); if (ws[ref] && ws[ref].t === 'n') ws[ref].z = z;
      }
      ws['!cols'] = widths.map(w => ({ wch: w }));
      return ws;
    }
    const wb = X.utils.book_new();

    // Übersicht
    const s = sumRange(from, to), soll = sollRange(from, to);
    X.utils.book_append_sheet(wb, sheet([
      ['Arbeitszeitnachweis', ''],
      ['Zeitraum', `${fmtShort(from)}${new Date(from).getFullYear()} – ${fmtShort(addDays(to, -1))}${new Date(addDays(to, -1)).getFullYear()}`],
      ['Ist (Stunden)', hrs(s.total)],
      ['davon Schule', hrs(s.byPlace.schule)],
      ['davon Zuhause', hrs(s.byPlace.zuhause)],
      ['Soll (Stunden)', hrs(soll)],
      ['Saldo (Stunden)', hrs(s.total - soll)],
      ['Jahressoll (Stunden)', st.yearly],
      ['Unterrichtswochen', st.weeks],
      ['Soll pro Unterrichtswoche', hrs(weeklySoll())],
      ['Beschäftigungsumfang (%)', st.pct],
      ['Erstellt am', `${fmtShort(Date.now())}${new Date().getFullYear()} ${fmtTime(Date.now())}`],
    ], { 1: '0.00' }, [28, 26]), 'Übersicht');

    // Einträge
    const rows = [['Datum', 'Tag', 'KW', 'Beginn', 'Ende', 'Dauer', 'Stunden', 'Tätigkeit', 'Ort', 'Notiz']];
    for (const e of entries) rows.push([xlDate(e.start), WD[new Date(e.start).getDay()], isoWeek(e.start).week, xlTime(e.start), xlTime(e.end), (e.end - e.start) / DAY, hrs(e.end - e.start), plain(catById(e.cat).name), PLACES[e.place], e.note || '']);
    X.utils.book_append_sheet(wb, sheet(rows, { 0: 'dd\\.mm\\.yyyy', 3: 'hh:mm', 4: 'hh:mm', 5: '[h]:mm', 6: '0.00' }, [12, 5, 5, 8, 8, 8, 9, 22, 10, 40]), 'Einträge');

    // Wochen
    const XCATS = CATS.filter(c => !c.deleted || state.entries.some(e => e.cat === c.id));
    const wk = [['KW', 'Von', 'Bis', 'Art', 'Ist', 'Soll', 'Saldo', 'Schule', 'Zuhause', ...XCATS.map(c => plain(c.raw || c.name))]];
    for (let w = startOfWeek(from); w < to; w = addDays(w, 7)) {
      const a = Math.max(w, from), b = Math.min(addDays(w, 7), to), x = sumRange(a, b), so = sollRange(a, b);
      wk.push([isoWeek(w).week, xlDate(a), xlDate(addDays(b, -1)), isHoliday(w) ? 'Ferien' : 'Unterricht', hrs(x.total), hrs(so), hrs(x.total - so), hrs(x.byPlace.schule), hrs(x.byPlace.zuhause), ...XCATS.map(c => hrs(x.byCat[c.id] || 0))]);
    }
    const wf = { 1: 'dd\\.mm\\.yyyy', 2: 'dd\\.mm\\.yyyy' }; for (let c = 4; c < wk[0].length; c++) wf[c] = '0.00'; wf[6] = '+0.00;-0.00;0.00';
    X.utils.book_append_sheet(wb, sheet(wk, wf, [5, 11, 11, 10, 8, 8, 8, 8, 8, ...XCATS.map(c => Math.max(9, plain(c.raw || c.name).length + 1))]), 'Wochen');

    // Tätigkeiten
    const per = {}; for (const c of XCATS) per[c.id] = { schule: 0, zuhause: 0 };
    for (const e of entries) per[catById(e.cat).id][e.place] += overlap(e, from, to);
    const tt = [['Tätigkeit', 'Schule', 'Zuhause', 'Gesamt', 'Anteil']];
    for (const c of XCATS) { const g = per[c.id].schule + per[c.id].zuhause; tt.push([plain(c.raw || c.name), hrs(per[c.id].schule), hrs(per[c.id].zuhause), hrs(g), s.total ? g / s.total : 0]); }
    tt.push(['Summe', hrs(s.byPlace.schule), hrs(s.byPlace.zuhause), hrs(s.total), s.total ? 1 : 0]);
    X.utils.book_append_sheet(wb, sheet(tt, { 1: '0.00', 2: '0.00', 3: '0.00', 4: '0%' }, [22, 9, 9, 9, 8]), 'Tätigkeiten');

    // Freie Tage und Ferienwochen
    const fd = [['Datum', 'Tag', 'KW', 'Art']];
    for (let d = startOfDay(from); d < to; d = addDays(d, 1)) {
      const wd = new Date(d).getDay(); if (wd === 0 || wd === 6) continue;
      if (isHoliday(d)) { if (wd === 1) fd.push([xlDate(d), 'Mo–Fr', isoWeek(d).week, 'Ferienwoche']); }
      else if (isOff(d)) fd.push([xlDate(d), WD[wd], isoWeek(d).week, OFF_REASONS[offReason(d)]]);
    }
    X.utils.book_append_sheet(wb, sheet(fd, { 0: 'dd\\.mm\\.yyyy' }, [12, 7, 5, 24]), 'Freie Tage');

    const buf = X.write(wb, { bookType: 'xlsx', type: 'array' });
    await saveFile(`Arbeitszeit_${label}.xlsx`, new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
  }

  async function saveFile(name, blob, okMsg = 'Excel-Datei gespeichert') {
    const dl = await downloadsP;
    if (dl) {
      try { await dl.save({ filename: name, data: blob }); toast(okMsg); }
      catch (e) { if (e && e.code !== 'declined') toast(e.code === 'rate_limited' ? 'Bitte kurz warten und erneut versuchen' : 'Speichern ist hier gerade nicht möglich'); }
      return;
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast(okMsg);
  }

  // ---------- Editor ----------
  // Tag aus der Wochengrafik: Einträge ansehen, korrigieren, nachtragen
  function openDay(day) {
    const list = state.entries.filter(x => x.end > day && x.start < day + DAY).sort((a, b) => a.start - b.start);
    const tot = list.reduce((s, x) => s + Math.min(x.end, day + DAY) - Math.max(x.start, day), 0);
    const gaps = dayGaps(day);
    $modal.innerHTML = `<div class="overlay" id="ov"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dyTitle">
      <div class="day-head"><h2 id="dyTitle">${fmtDay(day)}</h2><span class="num">${fmtDur(tot)} h</span></div>
      ${list.length ? `<div style="display:grid;gap:6px;margin:8px 0 4px">${list.map(entryHTML).join('')}</div><p class="hint">Eintrag antippen, um ihn zu korrigieren.</p>` : '<p class="hint">An diesem Tag ist noch nichts eingetragen.</p>'}
      <div class="actions">
        <div>${gaps.length ? `<button class="btn" id="dyGaps">Lücken füllen (${gaps.length})</button>` : ''}</div>
        <div><button class="btn" id="dyClose">Schließen</button><button class="btn primary" id="dyAdd">Zeit nachtragen</button></div>
      </div></div></div>`;
    $modal.querySelectorAll('[data-entry]').forEach(b => b.onclick = () => openEditor(state.entries.find(x => x.id === b.dataset.entry)));
    document.getElementById('dyAdd').onclick = () => openEditor(null, day);
    document.getElementById('dyClose').onclick = close;
    document.getElementById('ov').onclick = ev => { if (ev.target.id === 'ov') close(); };
    const g = document.getElementById('dyGaps'); if (g) g.onclick = () => askGaps(day);
  }
  function openEditor(entry, day) {
    const isNew = !entry;
    const now = Date.now();
    let st = now - 3600000, en = now;
    if (isNew && day != null) { // Nachtrag für einen bestimmten Tag: hinter dem letzten Eintrag weitermachen
      const last = Math.max(0, ...state.entries.filter(x => x.end > day && x.end <= day + DAY).map(x => x.end));
      st = last || day + 7.5 * 3600000; en = Math.min(st + 3600000, day + DAY - 60000);
    }
    const e = entry ? { ...entry } : { cat: sel.cat, place: sel.place, note: '', start: st, end: en };
    let cat = catById(e.cat).id, place = e.place, confirmDel = false, noteAsked = false, overlapKey = null;
    const dayTs = () => { const d = e._d || fmtDateInput(e.start); const [y, mo, da] = d.split('-').map(Number); return new Date(y, mo - 1, da).getTime(); };
    const ttDay = () => ttFor(dayTs());
    function draw(err) {
      $modal.innerHTML = `<div class="overlay" id="ov"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="edTitle">
        <h2 id="edTitle">${isNew ? 'Zeit nachtragen' : 'Eintrag korrigieren'}</h2>
        <span class="label">Tätigkeit</span>${chipsHTML(cat, 'data-ecat')}
        <span class="label">Ort</span>${placeHTML(place, 'data-eplace')}
        <div class="row">
          <div class="field"><label class="label" for="edDate">Datum</label><input type="date" id="edDate" value="${fmtDateInput(e.start)}"></div>
          <div class="field" style="flex-basis:100px"><label class="label" for="edFrom">Von</label><input type="time" id="edFrom" value="${fmtTime(e.start)}"></div>
          <div class="field" style="flex-basis:100px"><label class="label" for="edTo">Bis</label><input type="time" id="edTo" value="${fmtTime(e.end)}"></div>
        </div>
        ${isNew && ttDay().length ? `<div class="ttbox"><button class="btn" id="edTT">Unterricht laut Stundenplan einfügen</button><span class="hint">${ttText(ttDay())} · ${PLACES.schule}</span></div>` : ''}
        <div class="field"><label class="label" for="edNote">Notiz</label><input type="text" id="edNote" value="${esc(e.note)}"></div>
        ${err ? `<p class="warn">${err}</p>` : ''}
        ${confirmDel ? `<p class="warn">Diesen Eintrag wirklich löschen? Das lässt sich nicht rückgängig machen.</p>` : ''}
        <div class="actions">

  // Nach dem Nachtragen: Lücken zwischen Einträgen eines Tages nacheinander abfragen

      $modal.querySelectorAll('[data-gcat]').forEach(b => b.onclick = () => {

  // ---------- Abgleich zwischen Geräten (nur in claude.ai, private Daten des angemeldeten Nutzers) ----------
  // Ablage: data/users/<id>/meta (Einstellungen, Ferien, laufender Timer) und data/users/<id>/m-JJJJ-MM (Einträge des Monats).
  // Gelöschte Einträge bleiben als {deleted:true} stehen, damit andere Geräte sie ebenfalls entfernen.
  const META_KEYS = ['settings', 'offDays', 'holidayWeeks', 'presets', 'running', 'lastCat', 'lastPlace', 'timetable', 'customCats', 'coreHours'];
  const metaOf = () => { const m = {}; for (const k of META_KEYS) m[k] = state[k] === undefined ? null : state[k]; return m; };
  const canon = v => v === null || typeof v !== 'object' ? JSON.stringify(v) : Array.isArray(v) ? '[' + v.map(canon).join(',') + ']' : '{' + Object.keys(v).sort().filter(k => v[k] !== undefined).map(k => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}';
  const monthKey = t => { const d = new Date(t); return `m-${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
  let sync = { status: 'off', db: null, base: null, docs: new Set(), synced: new Map(), syncedMeta: null, ready: false, timer: null, busy: false, again: false, last: 0 };
  const syncLabel = () => ({ off: 'Nur auf diesem Gerät gespeichert', connecting: 'Abgleich wird verbunden …', on: 'Abgleich aktiv: Handy und Laptop zeigen dieselben Daten', err: 'Abgleich gerade nicht möglich, Daten bleiben auf diesem Gerät' })[sync.status];
  function setSyncStatus(st) { sync.status = st; const el = document.getElementById('syncInfo'); if (el) { el.textContent = syncLabel(); el.previousElementSibling.className = 'syncdot ' + (st === 'on' ? 'on' : st === 'err' ? 'err' : ''); } }

  function scheduleSync() { if (!sync.db || !sync.ready) return; clearTimeout(sync.timer); sync.timer = setTimeout(pushDiff, 400); }
  async function pushDiff() {
    if (!sync.db) return;
    if (sync.busy) { sync.again = true; return; }
    sync.busy = true;
    try {
      // Einträge je Monat sammeln
      const byMonth = {};
      const local = new Map(state.entries.map(e => [e.id, e]));
      for (const e of state.entries) { const j = canon(e); if (sync.synced.get(e.id) !== j) (byMonth[monthKey(e.start)] = byMonth[monthKey(e.start)] || {})[e.id] = { e, j }; }
      for (const [id, j] of sync.synced) if (!local.has(id) && j !== 'deleted') { let mk; try { mk = monthKey(JSON.parse(j).start); } catch (x) { continue; } (byMonth[mk] = byMonth[mk] || {})[id] = { e: { deleted: true, u: Date.now() }, j: 'deleted' }; }
      for (const [mk, items] of Object.entries(byMonth)) {
        const payload = {}; for (const [id, it] of Object.entries(items)) payload[id] = it.e;
        const ref = sync.db.doc(sync.base + '/' + mk);
        if (sync.docs.has(mk)) await ref.update({ entries: payload }); else { await ref.set({ entries: payload }); sync.docs.add(mk); }
        for (const [id, it] of Object.entries(items)) sync.synced.set(id, it.j);
      }
      const mj = canon(metaOf());
      if (mj !== sync.syncedMeta) {
        await sync.db.doc(sync.base + '/meta').set({ ...metaOf(), u: Date.now() });
        sync.syncedMeta = mj; sync.docs.add('meta');

    } catch (e) {

  function applyRemote(snap) {

    }
    sync.docs = docs;
    const local = new Map(state.entries.map(e => [e.id, e]));
    let changed = false;
    for (const [id, re] of remote) {
      const rj = re.deleted ? 'deleted' : canon({ ...re, id });
      const known = sync.synced.get(id);
      const le = local.get(id);
      if (re.deleted) {
        if (le && (!le.u || le.u <= re.u || known !== canon(le))) { local.delete(id); changed = true; }
      } else if (!le) {
        // fehlt lokal: neu von woanders, oder hier gelöscht und noch nicht hochgeladen
        if (known !== rj) { local.set(id, { ...re, id }); changed = true; }
      } else {
        const lj = canon(le);

        }

    }
    if (changed) {
      state.entries = [...local.values()];
      savedBodies = new Map(state.entries.map(e => [e.id, bodyOf(e)]));
    }

  // ---------- Datensicherung als Datei ----------
  function backupData() { return JSON.stringify({ app: 'lehrerzeit', version: 1, exportedAt: new Date().toISOString(), ...state }, null, 1); }
  function importBackup(text) {
    let data; try { data = JSON.parse(text); } catch (e) { toast('Die Datei ist keine Lehrerzeit-Sicherung.'); return; }
    if (!data || data.app !== 'lehrerzeit' || !Array.isArray(data.entries)) { toast('Die Datei ist keine Lehrerzeit-Sicherung.'); return; }
    const local = new Map(state.entries.map(e => [e.id, e])); let added = 0, updated = 0;
    for (const e of data.entries) {
      if (!e || !e.id || !e.start || !e.end) continue;
      const le = local.get(e.id);
      if (!le) { local.set(e.id, e); added++; } else if ((e.u || 0) > (le.u || 0)) { local.set(e.id, e); updated++; }
    }
    state.entries = [...local.values()];
    for (const k of ['offDays', 'holidayWeeks']) if (data[k]) state[k] = Object.assign({}, data[k], state[k] || {});
    if (data.settings && !state.settings) state.settings = data.settings;
    if (data.timetable && !state.timetable) state.timetable = data.timetable;
    if (data.coreHours && !state.coreHours) state.coreHours = data.coreHours;
    if (Array.isArray(data.customCats)) { const have = new Set(ownCats().map(c => c.id)); state.customCats = [...ownCats(), ...data.customCats.filter(c => c && c.id && !have.has(c.id))]; }
    const exported = Date.parse(data.exportedAt); if (exported) state.lastBackup = Math.max(state.lastBackup || 0, exported);
    savedBodies = new Map(state.entries.map(e => [e.id, bodyOf(e)]));
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    scheduleSync(); render();
    toast(`${added} Einträge übernommen${updated ? `, ${updated} aktualisiert` : ''}`);
  }
  // Auf Handy und Tablet über das Teilen-Menü (z. B. „In Dateien sichern“ → iCloud Drive/OneDrive), am Laptop als Download
  const BACKUP_ACCEPT = '.json,.txt,application/json,text/plain';

  function backupDone() {

  // Erinnerung und Wiederherstellen nur in der installierten App (in claude.ai gleicht der Abgleich ab)
  function backupDue() {

  // Browser bitten, die Daten dauerhaft zu behalten (nicht automatisch löschen, wenn der Speicher knapp wird)

      const t = startOfDay(Date.now()), ws = startOfWeek(Date.now());
      const a = document.getElementById('sumToday'), b = document.getElementById('sumWeek');
      if (a) a.textContent = fmtDur(sumRange(t, t + DAY).total) + ' h';
      if (b) b.textContent = fmtDur(sumRange(ws, ws + 7 * DAY).total) + ' h';
    }
  }, 1000);
  // Andere Tabs/Fenster: Änderungen übernehmen
  window.addEventListener('storage', ev => { if (ev.key === KEY) { try { state = Object.assign(state, JSON.parse(ev.newValue)); } catch (e) {} render(); } });

  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && document.querySelector('link[rel=manifest]')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  protectStorage();
  render();
})();
</script>
</html>
